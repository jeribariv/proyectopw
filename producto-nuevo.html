<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InventarioPro - Registro de Producto</title>
    <link rel="stylesheet" href="plantilla/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <nav aria-label="breadcrumb" id="migas"></nav>
        <div id="mensajes"></div>

        <div class="card shadow-sm"><div class="card-body p-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
                <h1 class="h2 fw-bold mb-0">Nuevo Producto <span class="badge rounded-pill bg-secondary fs-6 align-middle">Inventario</span></h1>
                <a href="dashboard.html" class="btn btn-outline-secondary btn-sm">Volver al Panel</a>
            </div>

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="nombre">Nombre del Producto</label>
                    <input type="text" id="nombre" class="form-control" placeholder="Ej. Teclado Mecánico RGB">
                    <div class="invalid-feedback">Ingrese el nombre del producto.</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="codigo">Código SKU</label>
                    <input type="text" id="codigo" class="form-control" placeholder="PROD-001">
                    <div class="invalid-feedback">SKU de 3 a 30 caracteres (letras, números, - o _).</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="categorias">Categorías Asignadas</label>
                    <select id="categorias" class="form-select" multiple size="4"></select>
                    <div class="invalid-feedback">Seleccione al menos una categoría.</div>
                    <div class="form-text">Ctrl + clic para elegir varias.</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="etiqueta">Etiqueta Visual</label>
                    <input type="color" id="etiqueta" class="form-control form-control-color w-100" value="#0d6efd">
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label" for="precio">Precio</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" step="0.01" min="0" id="precio" class="form-control">
                        <div class="invalid-feedback">Precio no válido.</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label" for="stock">Stock</label>
                    <input type="number" min="0" step="1" id="stock" class="form-control">
                    <div class="invalid-feedback">Entero de 0 o más.</div>
                </div>

                <div class="col-12">
                    <label class="form-label d-block">Disponibilidad Inicial</label>
                    <div class="btn-group" role="group">
                        <input type="radio" class="btn-check" name="estado" id="e1" value="en_stock" checked>
                        <label class="btn btn-outline-primary" for="e1">En Stock</label>
                        <input type="radio" class="btn-check" name="estado" id="e2" value="agotado">
                        <label class="btn btn-outline-primary" for="e2">Agotado</label>
                        <input type="radio" class="btn-check" name="estado" id="e3" value="descontinuado">
                        <label class="btn btn-outline-primary" for="e3">Descontinuado</label>
                    </div>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="publicado" checked>
                        <label class="form-check-label" for="publicado">Publicar inmediatamente en el catálogo general</label>
                    </div>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button class="btn btn-primary" id="guardar">Guardar Producto</button>
                    <a href="productos.html" class="btn btn-outline-danger">Cancelar</a>
                </div>
            </div>
        </div></div>
    </div>

    <script src="plantilla/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        migas([['Panel de Control', 'dashboard.html'], ['Registro de Producto']]);

        $('guardar').onclick = async () => {
            const d = {
                nombre: $('nombre').value.trim(), codigo: $('codigo').value.trim(),
                categorias: [...$('categorias').selectedOptions].map(o => Number(o.value)),
                etiqueta: $('etiqueta').value, precio: $('precio').value, stock: $('stock').value,
                estado: document.querySelector('input[name=estado]:checked').value,
                publicado: $('publicado').checked
            };
            const ok = marcar('nombre', d.nombre !== '') & marcar('codigo', /^[A-Za-z0-9_-]{3,30}$/.test(d.codigo))
                     & marcar('categorias', d.categorias.length > 0)
                     & marcar('precio', d.precio !== '' && Number(d.precio) >= 0) & marcar('stock', /^\d+$/.test(d.stock));
            if (!ok) return;
            try {
                await api('api/productos.php', 'POST', d);
                location.href = 'productos.html?ok=creado';
            } catch (e) { alerta('danger', e.message); }
        };

        (async () => {
            try {
                await sesion();
                const cats = await api('api/productos.php?categorias=1');
                $('categorias').innerHTML = cats.map(c => `<option value="${c.id}">${esc(c.nombre)}</option>`).join('');
            } catch (e) { alerta('danger', e.message); }
        })();
    </script>
</body>
</html>
