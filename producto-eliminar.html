<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InventarioPro - Eliminar Producto</title>
    <link rel="stylesheet" href="plantilla/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <nav aria-label="breadcrumb" id="migas"></nav>
        <div id="mensajes"></div>

        <div class="alert alert-danger" role="alert">
            <h4 class="alert-heading h5 fw-bold">¡Atención! Confirmación requerida</h4>
            <p class="mb-0 small">Esta acción no se puede deshacer. Se eliminará el registro permanentemente de la base de datos.</p>
        </div>

        <div class="card bg-light border shadow-sm mb-3"><div class="card-body">
            <h5 class="card-title fw-bold">Detalles del Registro:</h5>
            <p class="mb-1"><strong>SKU:</strong> <span id="dSku">-</span></p>
            <p class="mb-1"><strong>Producto:</strong> <span id="dNombre">-</span></p>
            <p class="mb-1"><strong>Categoría:</strong> <span id="dCat">-</span></p>
            <p class="mb-0"><strong>Estado Actual:</strong> <span id="dEstado">-</span></p>
        </div></div>

        <div class="d-flex gap-2">
            <button class="btn btn-danger" id="confirmar" disabled>Confirmar y Eliminar</button>
            <a href="productos.html" class="btn btn-secondary">Cancelar y Volver</a>
        </div>
    </div>

    <script src="plantilla/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        migas([['Panel de Control', 'dashboard.html'], ['Productos', 'productos.html'], ['Eliminar Producto']]);
        const id = idDeUrl();

        $('confirmar').onclick = async () => {
            try {
                await api('api/productos.php?id=' + encodeURIComponent(id), 'DELETE');
                location.href = 'productos.html?ok=eliminado';
            } catch (e) { alerta('danger', e.message); }
        };

        (async () => {
            try {
                await sesion();
                const p = await api('api/productos.php?id=' + encodeURIComponent(id));
                $('dSku').textContent = p.codigo; $('dNombre').textContent = p.nombre;
                $('dCat').textContent = p.categoria || '-'; $('dEstado').innerHTML = badgeEstado(p.estado);
                $('confirmar').disabled = false;
            } catch (e) { alerta('danger', e.message); }
        })();
    </script>
</body>
</html>
