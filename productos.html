<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InventarioPro - Productos</title>
    <link rel="stylesheet" href="plantilla/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <nav aria-label="breadcrumb" id="migas"></nav>
        <div id="mensajes"></div>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h1 class="h2 fw-bold mb-0">Productos</h1>
            <div class="d-flex gap-2">
                <a href="dashboard.html" class="btn btn-outline-secondary">Volver al Panel</a>
                <a href="producto-nuevo.html" class="btn btn-primary">Nuevo Producto</a>
            </div>
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text">Buscar</span>
            <input type="text" id="buscar" class="form-control" placeholder="Nombre o código SKU">
        </div>

        <div class="card shadow-sm"><div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>SKU</th><th>Producto</th><th>Categorías</th><th>Precio</th><th>Stock</th><th>Estado</th><th>Catálogo</th><th></th></tr></thead>
                <tbody id="tabla"></tbody>
            </table>
        </div></div>
    </div>

    <script src="plantilla/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        migas([['Panel de Control', 'dashboard.html'], ['Productos']]);
        const avisos = { creado: 'Producto creado correctamente.', actualizado: 'Producto actualizado correctamente.', eliminado: 'Producto eliminado correctamente.' };

        async function cargar() {
            try {
                const lista = await api('api/productos.php?q=' + encodeURIComponent($('buscar').value));
                $('tabla').innerHTML = lista.length ? lista.map(p => `<tr>
                    <td><span class="badge rounded-pill text-bg-light border">${esc(p.codigo)}</span></td>
                    <td><span class="d-inline-block rounded me-2 align-middle" style="width:10px;height:10px;background:${esc(p.etiqueta)}"></span>${esc(p.nombre)}</td>
                    <td>${esc(p.categoria)}</td>
                    <td>$ ${Number(p.precio).toFixed(2)}</td>
                    <td>${p.stock}</td>
                    <td>${badgeEstado(p.estado)}</td>
                    <td>${p.publicado == 1 ? '<span class="badge bg-primary">Publicado</span>' : '<span class="badge bg-secondary">Oculto</span>'}</td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary" href="producto-editar.html?id=${p.id}">Editar</a>
                        <a class="btn btn-sm btn-outline-danger" href="producto-eliminar.html?id=${p.id}">Eliminar</a>
                    </td></tr>`).join('')
                    : '<tr><td colspan="8" class="text-center text-muted">No hay productos. Cree el primero con "Nuevo Producto".</td></tr>';
            } catch (e) { alerta('danger', e.message); }
        }
        $('buscar').oninput = cargar;
        (async () => {
            const ok = new URLSearchParams(location.search).get('ok');
            if (avisos[ok]) alerta('success', avisos[ok]);
            await sesion(); cargar();
        })();
    </script>
</body>
</html>
