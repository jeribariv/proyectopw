<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InventarioPro - Panel de Control</title>
    <link rel="stylesheet" href="plantilla/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <nav aria-label="breadcrumb" id="migas"></nav>

        <div id="mensajes">
            <div class="alert alert-info alert-dismissible fade show" role="alert">
                Bienvenido al panel general del sistema.
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        </div>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h1 class="h2 fw-bold mb-0">Panel Operativo</h1>
            <div class="d-flex gap-2">
                <a href="productos.html" class="btn btn-primary">Mensajes <span class="badge bg-danger" id="msgs">0</span></a>
                <button class="btn btn-outline-secondary" id="salir">Cerrar sesión</button>
            </div>
        </div>

        <div class="row g-3">
            <!-- Navegación -->
            <div class="col-12 col-md-4 col-lg-3">
                <div class="list-group text-center shadow-sm">
                    <a href="dashboard.html" class="list-group-item list-group-item-action active">Inicio</a>
                    <a href="productos.html" class="list-group-item list-group-item-action">Productos</a>
                    <a href="usuarios.html" class="list-group-item list-group-item-action">Usuarios</a>
                </div>
            </div>

            <!-- Tarjetas de estado -->
            <div class="col-12 col-md-8 col-lg-9">
                <div class="row g-3">
                    <div class="col-12 col-lg-6">
                        <div class="card shadow-sm h-100"><div class="card-body">
                            <h5 class="card-title">Stock Disponible</h5>
                            <span class="badge bg-success" id="stock">- Unidades</span>
                            <span class="badge bg-light text-success border border-success ms-1">En Stock</span>
                        </div></div>
                    </div>
                    <div class="col-12 col-lg-6">
                        <div class="card shadow-sm h-100"><div class="card-body">
                            <h5 class="card-title">Avisos Pendientes</h5>
                            <span class="badge bg-warning text-dark" id="criticos">- Críticos</span>
                            <p class="small text-muted mt-2 mb-0">Productos con 10 unidades o menos.</p>
                        </div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="plantilla/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        migas([['Inicio', 'index.html'], ['Panel de Control']]);
        $('salir').onclick = async () => { await api('api/auth.php?accion=logout', 'POST'); location.href = 'index.html'; };
        (async () => {
            try {
                await sesion();
                const p = await api('api/productos.php');
                const stock = p.filter(x => x.estado === 'en_stock').reduce((s, x) => s + Number(x.stock), 0);
                const crit = p.filter(x => x.estado !== 'descontinuado' && Number(x.stock) <= 10).length;
                $('stock').textContent = stock + ' Unidades';
                $('criticos').textContent = crit + ' Críticos';
                $('msgs').textContent = crit;
            } catch (e) { alerta('danger', e.message); }
        })();
    </script>
</body>
</html>
