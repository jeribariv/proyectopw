<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InventarioPro - Editar Producto</title>
    <link rel="stylesheet" href="plantilla/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <nav aria-label="breadcrumb" id="migas"></nav>
        <div id="mensajes"></div>

        <div class="card shadow-sm"><div class="card-body p-4">
            <h1 class="h2 fw-bold mb-4">Modificar Producto
                <span class="badge rounded-pill bg-warning text-dark fs-6 align-middle" id="skuBadge">SKU: -</span></h1>

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="nombre">Nombre del Producto</label>
                    <input type="text" id="nombre" class="form-control">
                    <div class="invalid-feedback">Ingrese el nombre del producto.</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="codigo">Código SKU</label>
                    <input type="text" id="codigo" class="form-control" disabled>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="categoria">Categoría</label>
                    <select id="categoria" class="form-select"></select>
                    <div class="invalid-feedback">Elija una categoría.</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="etiqueta">Etiqueta Visual</label>
                    <input type="color" id="etiqueta" class="form-control form-control-color w-100">
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label" for="precio">Precio</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" step="0.01" min="0" id="precio" class="form-control">
                        <div class="invalid-feedback">Precio no válido.</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label" for="stock">Stock</label>
                    <input type="number" min="0" step="1" id="stock" class="form-control">
                    <div class="invalid-feedback">Entero de 0 o más.</div>
                </div>
                <div class="col-12">
                    <label class="form-label d-block">Disponibilidad</label>
                    <div class="btn-group" role="group" id="disp">
                        <input type="radio" class="btn-check" name="estado" id="e1" value="en_stock">
                        <label class="btn btn-outline-primary" for="e1">En Stock</label>
                        <input type="radio" class="btn-check" name="estado" id="e2" value="agotado">
                        <label class="btn btn-outline-primary" for="e2">Agotado</label>
                    </div>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button class="btn btn-warning" id="actualizar">Actualizar Cambios</button>
                    <a href="productos.html" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </div>
        </div></div>
    </div>

    <!-- Confirmación -->
    <div class="modal fade" id="modalConfirmar" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Confirmar cambios</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">¿Desea actualizar los datos de este producto?</div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Volver</button>
                <button class="btn btn-warning" id="confirmar">Sí, actualizar</button>
            </div>
        </div></div>
    </div>

    <script src="plantilla/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        migas([['Panel de Control', 'dashboard.html'], ['Productos', 'productos.html'], ['Editar Producto']]);
        const id = idDeUrl();
        let mConfirmar;

        $('actualizar').onclick = () => {
            const ok = marcar('nombre', $('nombre').value.trim() !== '') & marcar('categoria', $('categoria').value !== '')
                     & marcar('precio', $('precio').value !== '' && Number($('precio').value) >= 0)
                     & marcar('stock', /^\d+$/.test($('stock').value));
            if (ok) mConfirmar.show();
        };
        $('confirmar').onclick = async () => {
            mConfirmar.hide();
            try {
                await api('api/productos.php', 'PUT', {
                    id: Number(id), nombre: $('nombre').value.trim(), categoria_id: Number($('categoria').value),
                    etiqueta: $('etiqueta').value, precio: $('precio').value, stock: $('stock').value,
                    estado: document.querySelector('input[name=estado]:checked').value, publicado: publicado
                });
                location.href = 'productos.html?ok=actualizado';
            } catch (e) { alerta('danger', e.message); }
        };

        let publicado = true;
        (async () => {
            try {
                await sesion();
                mConfirmar = new bootstrap.Modal($('modalConfirmar'));
                const [p, cats] = await Promise.all([api('api/productos.php?id=' + encodeURIComponent(id)), api('api/productos.php?categorias=1')]);
                $('categoria').innerHTML = cats.map(c => `<option value="${c.id}">${esc(c.nombre)}</option>`).join('');
                $('skuBadge').textContent = 'SKU: ' + p.codigo;
                $('nombre').value = p.nombre; $('codigo').value = p.codigo; $('etiqueta').value = p.etiqueta;
                $('precio').value = p.precio; $('stock').value = p.stock; publicado = p.publicado == 1;
                $('categoria').value = p.categoria_ids[0] ?? '';
                if (p.estado === 'descontinuado')
                    $('disp').insertAdjacentHTML('beforeend', '<input type="radio" class="btn-check" name="estado" id="e3" value="descontinuado"><label class="btn btn-outline-primary" for="e3">Descontinuado</label>');
                document.querySelector(`input[name=estado][value=${p.estado}]`).checked = true;
            } catch (e) { alerta('danger', e.message); $('actualizar').disabled = true; }
        })();
    </script>
</body>
</html>
